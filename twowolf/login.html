<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./src/styles/login.css">
</head>

<body>

    <main class="container">

        <div class="back">
            <a href="#">←</a>
        </div>

            <h1 class="title">
                Welcome!
            </h1>

        <div class="content">

            <h2>
                Sign in
            </h2>
            
            <form>

                <div class="form-group">
                    <label 
                    for="email"></label>
                    <input 
                        type="email" 
                        name="email" 
                        id="email" 
                        placeholder="Enter your email or user">
                </div>

                <div class="form-group">
                    <label 
                    for="password"></label>
                    <input 
                        type="password" 
                        name="password" 
                        id="password" 
                        placeholder="Enter your password">
                </div>

                <div class="form-btn">
                    <button type="submit">login</button>
                </div>

                <div class="form-links">
                    <p class="reset">
                        Forgot your password? <a href="#">Reset</a>
                    </p>

                    <p class="register">
                        Don't have an account? <a href="#">Register</a>
                    </p>

                </div>

                <div class="divider">
                    <span>or</span>
                </div>

                    <div class="icons">
                        <img src="./src/images/other-login/icon-google.png" alt="google">
                        <img src="./src/images/other-login/icon-facebook.png" alt="facebook">
                        <img src="./src/images/other-login/icon-microsoft.png" alt="microsoft">
                    </div>
                </div>

            </form>

        </div>

    </main>

    <footer>
        2k26 © <a href="https://github.com/maiconfpss">maiconfpss</a>
    </footer>

</body>

</html>
