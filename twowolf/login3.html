<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome back</title>
    <link rel="stylesheet" href="./src/styles/login3.css">
</head>
<body>

    <main class="container">

        <div class="back">
            <a href="#">←</a>
        </div>

        <div class="profile">
            <img 
                src="./src/images/perfil/perfil.jpg" 
                alt="imagen de perfil"
                class="img-profile"
                >

              <h1 
                class="title">
                Welcome back <br>

                <span>
                    maiconfpss
                </span>

             </h1>

        </div>

        <div class="content">
            <form>

                <div class="form-group">
                    <label for="password"></label>
                        <input
                            type="password"
                            name="password"
                            id="password"
                            placeholder="Enter your password"
                            >
                </div>

                <div class="form-btn">
                    <button type="submit">enter</button>
                </div>

                <div class="form-links">
                    <p class="reset">
                            Forgot your password? <a href="#">Reset</a>
                    </p>

                    <p>
                            Not maiconfpss? <a href="#">Logout</a>
                    </p>

                </div>

            </form>

        </div>
        
    </main>

    <footer>
        2k26 © <a href="https://github.com/maiconfpss">maiconfpss</a>
    </footer>
    
</body>
</html>
