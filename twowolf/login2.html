<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="./src/styles/login2.css">
</head>
<body>

    <main class="container">

        <div class="back">
            <a href="#">←</a>
        </div>

        <h1 class="title">Welcome!</h1>

        <div class="content">

            <h2>Create account</h2>
            
            <form>

                <!-- INPUTS DE NOME -->
                <div class="name">
                    <input 
                        type="text" 
                        name="firstname" 
                        id="firstname" 
                        placeholder="First name">

                    <input 
                        type="text" 
                        name="lastname" 
                        id="lastname" 
                        placeholder="Last name">
                </div>

                <!-- EMAIL -->
                <div class="form-group">
                    <input 
                        type="email" 
                        name="email" 
                        id="email" 
                        placeholder="Enter your email or user">
                </div>

                <!-- SENHA -->
                <div class="form-group">
                    <input 
                        type="password" 
                        name="password" 
                        id="password" 
                        placeholder="Enter your password">
                </div>

                <!-- BOTÃO -->
                <div class="form-btn">
                    <button type="submit">create</button>
                </div>

                <!-- LINKS -->
                <div class="form-links">
                    <p class="reset">
                        Forgot your password? <a href="#">Reset</a>
                    </p>

                    <p class="register">
                        Already have an account? <a href="#">Sign in</a>
                    </p>
                </div>

                <!-- DIVISOR -->
                <div class="divider">
                    <span>or</span>
                </div>

                <!-- ÍCONES SOCIAIS -->
                <div class="icons">
                    <img src="./src/images/other-login/icon-google.png" alt="Google">
                    <img src="./src/images/other-login/icon-facebook.png" alt="Facebook">
                    <img src="./src/images/other-login/icon-microsoft.png" alt="Microsoft">
                </div>

            </form>

        </div>

    </main>

    <footer>
        2k26 © <a href="https://github.com/maiconfpss">maiconfpss</a>
    </footer>

</body>
</html>
